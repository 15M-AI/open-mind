[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mind-train"
version = "0.1.0"
description = "CPU-first local training for Open Mind models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools]
packages = ["open_mind", "open_mind_format"]
package-dir = {open_mind = "src/open_mind", open_mind_format = "../open-mind-format/python/src/open_mind_format"}
