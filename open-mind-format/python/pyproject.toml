[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mind-format"
version = "0.1.0"
description = "Python writer for Open Mind Format models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
